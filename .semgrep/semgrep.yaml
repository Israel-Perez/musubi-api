# Reglas SAST propias de musubi-api (se suman a --config=auto en el job semgrep).
# Cada regla cita el principio/NFR que protege. Probadas con archivos de prueba (ver Memoria.md).
rules:
  - id: musubi-cs-cors-allow-any-origin
    languages: [csharp]
    severity: ERROR
    message: >-
      CORS abierto a cualquier origen. Usar la politica MusubiCors con Cors:AllowedOrigins
      (01-02, OWASP API8 Security Misconfiguration).
    pattern-either:
      - pattern: $P.AllowAnyOrigin()
      - pattern: $P.SetIsOriginAllowed(_ => true)

  - id: musubi-cs-disabled-certificate-validation
    languages: [csharp]
    severity: ERROR
    message: >-
      Se desactiva la validacion de certificados TLS (RNF-02 comunicacion cifrada).
      Nunca aceptar cualquier certificado, tampoco en clientes HTTP hacia la IA o la moderacion.
    pattern-either:
      - pattern: HttpClientHandler.DangerousAcceptAnyServerCertificateValidator
      - pattern: |
          $H.ServerCertificateCustomValidationCallback = ($A, $B, $C, $D) => true;
      - pattern: |
          ServicePointManager.ServerCertificateValidationCallback = ($A, $B, $C, $D) => true;

  - id: musubi-cs-hardcoded-signing-key
    languages: [csharp]
    severity: ERROR
    message: >-
      Llave de firma escrita en el codigo. Las llaves (JWT, IA, Firebase Admin, cifrado de la CLABE)
      llegan por configuracion: user-secrets en local, variables/secretos en el despliegue (00-04).
    pattern-either:
      - pattern: new SymmetricSecurityKey(Encoding.UTF8.GetBytes("..."))
      - pattern: new SymmetricSecurityKey(Encoding.ASCII.GetBytes("..."))

  - id: musubi-connection-string-with-password
    languages: [generic]
    severity: ERROR
    message: >-
      Connection string con password (o URI mongodb:// con usuario:clave) en un archivo versionado. Usar user-secrets,
      appsettings.Local.json (ignorado) o variables de entorno (01-04).
    paths:
      include:
        - "*.cs"
        - "*.json"
      exclude:
        - "*Test/**"
    pattern-either:
      - pattern-regex: (?i)(Host|Server|Data Source)=[^"]*;\s*(Password|Pwd)=[^;"\s]+
      - pattern-regex: (?i)mongodb(\+srv)?://[^/\s:@"]+:[^@\s"]+@

  - id: musubi-todo-marker
    languages: [generic]
    severity: ERROR
    message: >-
      Marcador TODO. Usar NOTE (NN-NN) o NOTE (HU-NN) con su spec duena y registrarlo en
      task.md y Memoria.md (traceability en 4 capas).
    paths:
      include:
        - "*.cs"
        - "*.ps1"
        - "*.yml"
        - "*.yaml"
      exclude:
        - ".semgrep/**"
        - "scripts/critic-guardrails.ps1"
    pattern-regex: (//|#|/\*)[^\n]*\bTODO\b
