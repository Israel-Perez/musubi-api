name: ci-pr

# Orden logico (01-05): build -> unit/integration/security/contract/database -> critic/endpoints/semgrep/docker-build/terraform.
# Actions fijadas por SHA (00-04, regla 11); Dependabot las actualiza.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Musubi.slnx
      - run: dotnet build Musubi.slnx -c Release --no-restore

  unit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Musubi.slnx
      - run: dotnet build Musubi.slnx -c Release --no-restore
      - run: dotnet test --project UnitTest/UnitTest.csproj -c Release --no-build

  integration:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Musubi.slnx
      - run: dotnet build Musubi.slnx -c Release --no-restore
      - run: dotnet test --project IntegrationTest/IntegrationTest.csproj -c Release --no-build

  security:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Musubi.slnx
      - run: dotnet build Musubi.slnx -c Release --no-restore
      - run: dotnet test --project SecurityTest/SecurityTest.csproj -c Release --no-build

  contract:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Musubi.slnx
      - run: dotnet build Musubi.slnx -c Release --no-restore
      - run: dotnet test --project ContractTest/ContractTest.csproj -c Release --no-build

  database:
    # MongoDB real con Testcontainers (Docker del runner): aplica db/*.js y prueba los repositorios (02-01).
    # ubuntu-22.04 y no -latest: mongod 8.0 se niega a arrancar en kernels Linux >= 6.19 (SERVER-121912),
    # que ya llegan a algunos runners -latest. Atlas y WSL2 no se ven afectados. Revisar al subir mongo.
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - run: uname -r
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Musubi.slnx
      - run: dotnet build Musubi.slnx -c Release --no-restore
      - run: dotnet test --project DatabaseTest/DatabaseTest.csproj -c Release --no-build

  critic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - shell: pwsh
        run: ./scripts/critic-guardrails.ps1

  endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: pwsh
        run: ./scripts/check_endpoints.ps1

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.181.0
      - run: semgrep scan --config=auto --config=.semgrep/semgrep.yaml --error

  docker-build:
    # Verifica el Dockerfile sin publicar nada (sin login ni push).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --pull -t musubi-api:ci .

  terraform:
    # 02-05: formato y validacion de infra/ (sin credenciales ni estado remoto).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: terraform validate
        run: |
          for dir in infra/bootstrap infra/stack; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
