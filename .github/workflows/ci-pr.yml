name: ci-pr

# Orden logico (01-05): build -> unit/integration/security/contract/database -> critic/endpoints/semgrep/docker-build/terraform.
# Actions fijadas por SHA (00-04, regla 11); Dependabot las actualiza.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore Musubi.slnx
      - run: dotnet build Musubi.slnx -c Release --no-restore

  unit:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore Musubi.slnx
      - run: dotnet build Musubi.slnx -c Release --no-restore
      - run: dotnet test --project UnitTest/UnitTest.csproj -c Release --no-build
      # SCRUM-120: cada fila de docs/endpoints.md con su prueba unitaria (tambien las HU que vengan).
      - name: Prueba unitaria por endpoint
        shell: pwsh
        run: ./scripts/check_endpoint_tests.ps1 -Suite UnitTest

  performance:
    # SCRUM-94: p95 de las rutas publicas bajo carga concurrente (en proceso, umbral en LatencyTests).
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore Musubi.slnx
      - run: dotnet build Musubi.slnx -c Release --no-restore
      - run: dotnet test --project PerformanceTest/PerformanceTest.csproj -c Release --no-build --output Detailed

  integration:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore Musubi.slnx
      - run: dotnet build Musubi.slnx -c Release --no-restore
      - run: dotnet test --project IntegrationTest/IntegrationTest.csproj -c Release --no-build
      # SCRUM-120: cada fila de docs/endpoints.md con su prueba de integracion (tambien las HU que vengan).
      - name: Prueba de integracion por endpoint
        shell: pwsh
        run: ./scripts/check_endpoint_tests.ps1 -Suite IntegrationTest

  security:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore Musubi.slnx
      - run: dotnet build Musubi.slnx -c Release --no-restore
      - run: dotnet test --project SecurityTest/SecurityTest.csproj -c Release --no-build
      # SCRUM-120: cada fila de docs/endpoints.md con su prueba de seguridad (tambien las HU que vengan).
      - name: Prueba de seguridad por endpoint
        shell: pwsh
        run: ./scripts/check_endpoint_tests.ps1 -Suite SecurityTest

  contract:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore Musubi.slnx
      - run: dotnet build Musubi.slnx -c Release --no-restore
      - run: dotnet test --project ContractTest/ContractTest.csproj -c Release --no-build

  database:
    # MongoDB real con Testcontainers (Docker del runner): aplica db/*.js y prueba los repositorios (02-01).
    # ubuntu-22.04 y no -latest: mongod 8.0 se niega a arrancar en kernels Linux >= 6.19 (SERVER-121912),
    # que ya llegan a algunos runners -latest. Atlas y WSL2 no se ven afectados. Revisar al subir mongo.
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - run: uname -r
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore Musubi.slnx
      - run: dotnet build Musubi.slnx -c Release --no-restore
      - run: dotnet test --project DatabaseTest/DatabaseTest.csproj -c Release --no-build

  critic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - shell: pwsh
        run: ./scripts/critic-guardrails.ps1

  endpoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: pwsh
        run: ./scripts/check_endpoints.ps1

  gitleaks:
    # 02-10 / SCRUM-123: secretos en el historial completo de Git (critic solo revisa el diff). Binario oficial
    # verificado por checksum; la salida oculta los valores. Excepciones revisadas: .gitleaksignore.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .

  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.181.0
      - run: semgrep scan --config=auto --config=.semgrep/semgrep.yaml --error

  docker-build:
    # Verifica el Dockerfile y escanea la imagen (Trivy) sin publicar nada (sin login ni push).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --pull -t musubi-api:ci .
      # 02-06: falla si la imagen trae vulnerabilidades criticas con arreglo publicado.
      - name: Trivy (imagen)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c             image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress musubi-api:ci

  terraform:
    # 02-05: formato y validacion de infra/ (sin credenciales ni estado remoto).
    # SCRUM-125: y escaneo de seguridad del IaC con Trivy (misma imagen fijada que docker-build).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Falla con hallazgos HIGH o CRITICAL. Una excepcion va junto al recurso con
      # "#trivy:ignore:<ID>" y su motivo (como los nosemgrep). Antes del init: sin .terraform/.
      - name: Trivy (IaC)
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src             aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c             config --exit-code 1 --severity HIGH,CRITICAL infra
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: terraform validate
        run: |
          for dir in infra/bootstrap infra/stack; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
