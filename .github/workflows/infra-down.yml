name: infra-down

# 02-05 / lineamiento 15: un paso automatizado elimina lo desplegado y la infraestructura.
# No toca la base de Atlas, el registro de imagenes, los secretos de Parameter Store ni la base de la cuenta
# (infra/bootstrap). Al volver a crear con infra-up, la URL de CloudFront cambia (sin dominio propio).
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Escribe DESTRUIR para eliminar la infraestructura"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.16.6

jobs:
  destroy:
    if: inputs.confirmar == 'DESTRUIR'
    runs-on: ubuntu-24.04
    environment: produccion
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform destroy
        working-directory: infra/stack
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false \
            -backend-config="bucket=musubi-tfstate-$account" \
            -backend-config="key=stack/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"
          # image_tag no se usa al destruir, pero la variable es obligatoria.
          terraform destroy -input=false -auto-approve -var "image_tag=destroy"
          echo "### Infraestructura eliminada" >> "$GITHUB_STEP_SUMMARY"
