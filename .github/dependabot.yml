version: 2
# cooldown: espera 7 dias antes de proponer versiones recien publicadas (mitiga paquetes comprometidos).
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      testing:
        patterns: ["xunit*", "coverlet*"]
      # Los SDK de AWS salen casi cada semana: un solo PR en lugar de cinco (12-Nov-2026).
      aws:
        patterns: ["AWSSDK.*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # La API es net10.0: una version mayor de .NET cambia el target, global.json y las dos imagenes juntas, y se
    # decide aparte. Con solo una imagen no compila (sdk) o no arranca (aspnet). Ver #73 y #74 (12-Nov-2026).
    ignore:
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: "/deploy"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # mongo: solo parches de la linea 8.0 (la de Atlas M0); 8.x rapidas y 9.x no.
    ignore:
      - dependency-name: "mongo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
