# Infraestructura local de musubi-api: PostgreSQL 18 (mismo major objetivo que la base administrada en AWS).
# Uso: copiar deploy/.env.example -> deploy/.env (ignorado), poner una contrasena local y ejecutar
#   docker compose -f deploy/docker-compose.local.yml --env-file deploy/.env up -d
name: musubi-local

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: musubi-postgres
    environment:
      POSTGRES_DB: musubi
      POSTGRES_USER: musubi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en deploy/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - musubi-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musubi -d musubi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  musubi-pgdata:
